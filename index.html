<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodExpress</title>
<style>
:root{--bg:#f6f1e8;--card:#fff;--ink:#2a2420;--mut:#7d746b;--ac:#b04a32;--ln:#e6dccd;--gr:#2f3b2c;--soft:#f7e3da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1b18;--card:#2a2522;--ink:#f3ece3;--mut:#a89f95;--ln:#3d3631;--soft:#4a2e26}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Georgia,serif;margin:0}h1{font-size:30px}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;width:100%;margin-top:12px}.btn.s{width:auto;margin:0;padding:6px 12px;font-size:13px}
.btn.o{background:none;color:var(--ac);border:1px solid var(--ac)}
nav{display:flex;gap:18px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ln);flex-wrap:wrap}nav a{cursor:pointer;color:var(--mut)}nav a.on{color:var(--ac);font-weight:600}nav .sp{flex:1}
.logo{font-size:20px;color:var(--ac)}.wrap{max-width:1080px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:18px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.pimg{height:110px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:8px}
.tag{font-size:11px;color:var(--ac);letter-spacing:.06em;text-transform:uppercase}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 14px;margin:0 6px 6px 0}.chip.on{background:var(--ink);color:var(--bg)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.auth .hero{background:linear-gradient(160deg,#8a3b28,#3b2a22);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:flex-end}.auth .hero h1{font-size:38px}.auth .f{padding:50px;max-width:460px;margin:auto;width:100%}
@media(max-width:700px){.auth{grid-template-columns:1fr}.auth .hero{min-height:200px}}
.err{color:#c0392b;font-size:13px;margin-top:8px}.ok{background:#e4f0e4;color:#2d6a3a;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px}
.adm{display:grid;grid-template-columns:200px 1fr;min-height:100vh}.side{background:var(--gr);color:#eee;padding:18px;display:flex;flex-direction:column;gap:6px}.side .logo{color:#fff;margin-bottom:14px}
.side a{padding:8px 10px;border-radius:8px;cursor:pointer}.side a.on{background:#ffffff22}
@media(max-width:700px){.adm{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;padding:6px}td{padding:8px 6px;border-top:1px solid var(--ln);font-size:14px}
.st{padding:2px 9px;border-radius:12px;font-size:12px;background:var(--soft);color:var(--ac);white-space:nowrap}.st.Entregado{background:#e4f0e4;color:#2d6a3a}.st.En\ camino{background:#e3ecf7;color:#2f5e99}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}.stats b{font-size:24px;display:block;font-family:Georgia,serif}
.steps{display:flex;gap:6px;margin:16px 0}.steps div{flex:1;text-align:center;font-size:13px;color:var(--mut);border-top:4px solid var(--ln);padding-top:6px}.steps .d{border-color:var(--ac);color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}.bars div{flex:1;background:#e8cfc4;border-radius:4px 4px 0 0;text-align:center;font-size:11px;position:relative}.bars .m{background:var(--ac)}.bars span{position:absolute;bottom:-18px;left:0;right:0;color:var(--mut)}
.tg{width:44px}
</style></head><body><div id="app"></div>
<script>
const $=n=>'$'+Number(n).toLocaleString('es-CO'),FEE=6000,ST=['Recibido','En preparación','En camino','Entregado'];
const S={user:null,admin:false,view:'login',pid:null,oid:null,cat:'Todos',q:'',err:'',msg:'',cart:[],editId:'P001',tmp:[],
users:[{email:'valentina.gomez@email.com',pass:'12345678',name:'Valentina Gómez',phone:'310 555 0182'}],
prods:[['P001','Pollo de la casa','Platos fuertes',28000,'🍗','Pechuga a la parrilla con papas criollas al romero, ensalada fresca y salsa de la casa.'],['P002','Bowl de la huerta','Platos fuertes',32000,'🥗','Quinoa, vegetales asados y aguacate.'],['P003','Hamburguesa La Mesa','Platos fuertes',29000,'🍔','Carne artesanal, queso y papas.'],['P004','Empanadas de la abuela','Entradas',12000,'🥟','Tres unidades, con nuestro ají.'],['P005','Limonada de hierbabuena','Bebidas',8000,'🍋','Limón fresco y un toque de hierbabuena.'],['P006','Brownie tibio','Postres',10000,'🍫','Chocolate y helado de vainilla.']].map(p=>({id:p[0],name:p[1],cat:p[2],price:p[3],emo:p[4],desc:p[5],rid:p[6]||'r1',on:true})),
bizs:{r1:{admin:'camila@lamesa.co',emo:'🍽️',tag:'Cocina de barrio',name:'La Mesa',desc:'Cocina de barrio desde 2018. Recetas honestas, ingredientes frescos y comida hecha con cariño.',addr:'Calle 45 # 18-24 Teusaquillo, Bogotá',tel:'601 555 0124',mail:'hola@lamesa.co',fee:6000,time:'35–45 minutos',zones:'Galerías, Teusaquillo y Chapinero',open:true}},
orders:[],rid:'r1'};
const mk=(id,t,n,ph,ad,b,items,st)=>S.orders.push({id,t,name:n,phone:ph,addr:ad,barrio:b,note:'',items,fee:FEE,st,rid:'r1'});
mk(1048,'12:40','Valentina Gómez','310 555 0182','Calle 53 # 24-18, Apto. 302','Galerías',[{id:'P001',q:2,note:'Sin cebolla en la ensalada.'},{id:'P004',q:1},{id:'P005',q:2}],'En preparación');
mk(1047,'12:38','Diego Ramírez','315 555 0139','Carrera 19 # 42-10','Teusaquillo',[{id:'P003',q:1}],'Recibido');
mk(1046,'12:36','Andrea Rojas','300 555 0115','Calle 60 # 13-22','Chapinero',[{id:'P002',q:1}],'Recibido');
mk(1045,'12:32','Luis Torres','311 555 0140','Carrera 22 # 48-15','Galerías',[{id:'P001',q:1},{id:'P005',q:1}],'En preparación');
mk(1044,'12:28','Marta Díaz','320 555 0177','Calle 46 # 20-31','Teusaquillo',[{id:'P003',q:1},{id:'P006',q:1}],'En camino');
Object.defineProperty(S,'biz',{get:()=>S.bizs[S.rid]});
Object.assign(S.bizs,{r2:{admin:'andres@saborcriollo.co',emo:'🥘',tag:'Comida colombiana',name:'Sabor Criollo',desc:'Sabores tradicionales de todo el país.',addr:'Carrera 13 # 60-20, Bogotá',tel:'601 555 0200',mail:'hola@saborcriollo.co',fee:5000,time:'30–40 minutos',zones:'Chapinero y Teusaquillo',open:true},r3:{admin:'sofia@nonna.co',emo:'🍕',tag:'Pizzas y pastas',name:'Pizzería Nonna',desc:'Pizzas artesanales al horno de piedra.',addr:'Calle 72 # 9-15, Bogotá',tel:'601 555 0300',mail:'hola@nonna.co',fee:4000,time:'25–35 minutos',zones:'Chapinero y Galerías',open:true}});
S.prods.push(...[['S01','Bandeja paisa','Platos fuertes',35000,'🍛','Frijoles, arroz, carne, chicharrón, huevo y arepa.','r2'],['S02','Ajiaco santafereño','Platos fuertes',30000,'🍲','Con pollo, mazorca y guascas.','r2'],['S03','Arepa con queso','Entradas',9000,'🫓','Asada y rellena de queso.','r2'],['S04','Jugo de lulo','Bebidas',7000,'🥤','Natural, con o sin leche.','r2'],['N01','Pizza margarita','Platos fuertes',32000,'🍕','Tomate, mozzarella y albahaca.','r3'],['N02','Pizza pepperoni','Platos fuertes',38000,'🍕','Pepperoni y mozzarella.','r3'],['N03','Lasaña de carne','Platos fuertes',34000,'🍝','Gratinada al horno.','r3'],['N04','Tiramisú','Postres',14000,'🍰','Receta clásica italiana.','r3']].map(p=>({id:p[0],name:p[1],cat:p[2],price:p[3],emo:p[4],desc:p[5],rid:p[6],on:true})));
S.orders.push({id:1050,t:'12:30',name:'Camilo Pardo',phone:'300 555 0111',addr:'Calle 70 # 10-12',barrio:'Chapinero',note:'',items:[{id:'S01',q:1},{id:'S03',q:2}],fee:5000,st:'Recibido',rid:'r2'},{id:1051,t:'12:34',name:'Laura Vega',phone:'301 555 0122',addr:'Calle 75 # 11-20',barrio:'Chapinero',note:'',items:[{id:'N01',q:2}],fee:4000,st:'En preparación',rid:'r3'});
const RP=()=>S.prods.filter(p=>p.rid==S.rid),RO=()=>S.orders.filter(o=>o.rid==S.rid);
const P=id=>S.prods.find(p=>p.id==id),tot=o=>o.items.reduce((s,i)=>s+P(i.id).price*i.q,0),cnt=l=>l.reduce((s,i)=>s+i.q,0);
const go=(v,x)=>{S.view=v;S.err=S.msg='';if(v=='prod')S.pid=x;if(v=='track')S.oid=x;render();scrollTo(0,0)};
const v=id=>document.getElementById(id).value;
function render(){const a=S.view.startsWith('a_');document.getElementById('app').innerHTML=({login,register,home,menu,prod,checkout,track,orders,a_login,a_orders,a_prods,a_sales,a_biz}[S.view])()}
const nav=()=>`<nav><span class="logo">FoodExpress</span><a class="${S.view=='home'?'on':''}" onclick="go('home')">Restaurantes</a><a class="${S.view=='menu'?'on':''}" onclick="go('menu')">Menú · ${S.biz.name}</a><a class="${S.view=='checkout'?'on':''}" onclick="go('checkout')">Mi pedido</a><a class="${S.view=='orders'?'on':''}" onclick="go('orders')">Mis pedidos</a><span class="sp"></span><span>Hola, ${S.user.name.split(' ')[0]}</span><button class="btn s" onclick="go('checkout')">Mi pedido · ${cnt(S.cart)}</button><a onclick="S.user=null;go('login')">Salir</a></nav>`;
const foot=()=>`<div class="wrap" style="color:var(--mut);font-size:13px">${S.biz.name} · ${S.biz.addr} · ¿Necesitas ayuda? ${S.biz.tel}</div>`;
function authWrap(hero,form){return `<div class="auth"><div class="hero"><h1>${hero}</h1><p>Pedidos rápidos y ordenados para clientes. Gestión fácil para restaurantes.</p></div><div class="f">${form}</div></div>`}
function login(){return authWrap('Tus restaurantes favoritos,<br>en un solo lugar.',`<span class="logo">FoodExpress</span><h2 style="margin-top:20px">Bienvenido a FoodExpress.</h2><p style="color:var(--mut)">Inicia sesión y encuentra algo rico para hoy.</p><label>Correo electrónico</label><input id="e" value="valentina.gomez@email.com"><label>Contraseña</label><input id="p" type="password" value="12345678"><div class="err">${S.err}</div><button class="btn" onclick="doLogin()">Iniciar sesión</button><p>¿Es tu primera vez? <a style="color:var(--ac);cursor:pointer" onclick="go('register')">Crea una cuenta</a></p><p><a style="color:var(--mut);cursor:pointer;font-size:13px" onclick="go('a_login')">Acceso para restaurantes →</a></p>`)}
function doLogin(){const u=S.users.find(u=>u.email==v('e').trim()&&u.pass==v('p'));if(!u){S.err='Correo o contraseña incorrectos.';return render()}S.user=u;go('home')}
function register(){return authWrap('Pide más rápido,<br>sin complicaciones.',`<span class="logo">FoodExpress</span><h2 style="margin-top:20px">Crea tu cuenta</h2><label>Nombre y apellido</label><input id="n"><label>Correo electrónico</label><input id="e"><label>Teléfono</label><input id="t"><label>Contraseña (8+ caracteres, una letra y un número)</label><input id="p" type="password"><label>Confirmar contraseña</label><input id="p2" type="password"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c" style="width:auto"> Acepto los términos y la política de datos</label><div class="err">${S.err}</div><button class="btn" onclick="doReg()">Crear mi cuenta</button><p><a style="color:var(--ac);cursor:pointer" onclick="go('login')">← Ya tengo cuenta</a></p>`)}
function doReg(){const [n,e,t,p]=['n','e','t','p'].map(v),ok=/^\S+@\S+\.\S+$/.test(e);S.err=!n||!t?'Completa todos los campos.':!ok?'Correo no válido.':p.length<8||!/[a-z]/i.test(p)||!/\d/.test(p)?'La contraseña debe tener 8 caracteres, una letra y un número.':p!=v('p2')?'Las contraseñas no coinciden.':!document.getElementById('c').checked?'Debes aceptar los términos.':S.users.some(u=>u.email==e)?'Ese correo ya existe.':'';if(S.err)return render();const u={email:e,pass:p,name:n,phone:t};S.users.push(u);S.user=u;go('home')}
function cards(){const q=S.q.toLowerCase();return RP().filter(p=>(S.cat=='Todos'||p.cat==S.cat)&&p.name.toLowerCase().includes(q)).map(p=>`<div class="card" style="${p.on?'':'opacity:.5'}"><div class="pimg" onclick="go('prod','${p.id}')" style="cursor:pointer">${p.emo}</div><div class="tag">${p.cat}</div><b>${p.name}</b><div style="color:var(--mut);font-size:13px">${p.desc}</div><div class="row"><b>${$(p.price)}</b>${p.on?`<button class="btn s" onclick="add('${p.id}',1)">+</button>`:'<span class="tag">Agotado</span>'}</div></div>`).join('')||'<p>No encontramos nada.</p>'}
function menu(){const cats=['Todos',...new Set(RP().map(p=>p.cat))];return nav()+`<div class="wrap"><a style="cursor:pointer;color:var(--mut)" onclick="go('home')">← Todos los restaurantes</a><h1>${S.biz.name}</h1><p class="tag">${S.biz.tag}</p><p style="color:var(--mut)">● ${S.biz.open?'Abierto hasta las 21:00':'Cerrado'} · Entrega en ${S.biz.time} · Precios en COP</p><div class="two"><div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div>${cats.map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div><input placeholder="Buscar algo rico..." value="${S.q}" style="max-width:220px" oninput="S.q=this.value;document.getElementById('grid').innerHTML=cards()"></div><div class="grid" id="grid" style="margin-top:12px">${cards()}</div></div>${cartBox()}</div></div>`+foot()}
function cartBox(){const sub=tot({items:S.cart});return `<div class="card" style="align-self:start"><h3>Tu pedido</h3>${S.cart.length?S.cart.map(i=>`<div class="row"><span>${i.q} ${P(i.id).name}</span><b>${$(P(i.id).price*i.q)}</b></div>`).join(''):'<p style="color:var(--mut)">Aún no has elegido nada.</p>'}<div class="row"><span>Subtotal</span><b>${$(sub)}</b></div><small style="color:var(--mut)">El domicilio se calcula al confirmar.</small><button class="btn" onclick="go('checkout')">Revisar mi pedido →</button></div>`}
function add(id,q,note){const c=S.cart.find(i=>i.id==id);c?(c.q+=q,note&&(c.note=note)):S.cart.push({id,q,note});if(S.view=='prod')return go('menu');render()}
function prod(){const p=P(S.pid);window.qn=1;return nav()+`<div class="wrap"><a style="cursor:pointer;color:var(--mut)" onclick="go('menu')">← Volver al menú</a><div class="two" style="margin-top:12px"><div class="pimg" style="height:300px;font-size:120px">${p.emo}</div><div><div class="tag">${p.cat}</div><h1>${p.name}</h1><h3 style="color:var(--ac)">${$(p.price)} COP</h3><p>${p.desc}</p><p class="ok">✓ ${p.on?'Disponible hoy':'No disponible'}</p><label>¿Cuántos te preparamos?</label><div class="row" style="justify-content:flex-start"><button class="chip" onclick="qn=Math.max(1,qn-1);qv.textContent=qn;tt()">−</button><b id="qv">1</b><button class="chip" onclick="qn++;qv.textContent=qn;tt()">+</button></div><label>Nota para la cocina (opcional)</label><textarea id="nt" placeholder="Sin cebolla en la ensalada, por favor."></textarea><button class="btn" ${p.on?'':'disabled'} onclick="add('${p.id}',qn,v('nt'))" id="ab">Agregar 1 al pedido · ${$(p.price)}</button><small style="color:var(--mut)">¿Alguna alergia? Cuéntanos en la nota o llama al ${S.biz.tel}.</small></div></div></div>`}
function tt(){ab.textContent=`Agregar ${qn} al pedido · ${$(P(S.pid).price*qn)}`}
function checkout(){const u=S.user,sub=tot({items:S.cart});return nav()+`<div class="wrap"><h1>Una buena comida está en camino.</h1><p style="color:var(--mut)">Revisa tu selección y dinos dónde te la llevamos.</p><div class="two"><div class="card"><h3>¿A dónde llevamos tu pedido?</h3><label>Nombre de quien recibe</label><input id="n" value="${u.name}"><label>Teléfono</label><input id="t" value="${u.phone}"><label>Dirección de entrega</label><input id="d" placeholder="Calle 53 # 24-18"><label>Apartamento / interior</label><input id="a"><label>Barrio (cobertura: ${S.biz.zones})</label><input id="b"><label>Indicaciones (opcional)</label><textarea id="i"></textarea><div class="err">${S.err}</div></div><div class="card" style="align-self:start"><h3>Tu pedido · ${cnt(S.cart)} productos</h3>${S.cart.map((i,k)=>`<div class="row"><div><b>${P(i.id).name}</b><br><small>${i.q} × ${$(P(i.id).price)} ${i.note?'· '+i.note:''}</small></div><div>${$(P(i.id).price*i.q)}<br><a style="cursor:pointer;color:var(--ac);font-size:12px" onclick="S.cart[${k}].q++;render()">+</a> <a style="cursor:pointer;color:var(--ac);font-size:12px" onclick="S.cart[${k}].q--;S.cart=S.cart.filter(x=>x.q>0);render()">−</a> <a style="cursor:pointer;color:var(--ac);font-size:12px" onclick="S.cart.splice(${k},1);render()">Quitar</a></div></div>`).join('')||'<p>Tu pedido está vacío.</p>'}<div class="row"><span>Subtotal</span>${$(sub)}</div><div class="row"><span>Domicilio</span>${$(S.biz.fee)}</div><div class="row"><b>Total del pedido</b><b>${$(sub+S.biz.fee)}</b></div><button class="btn" onclick="place()">Crear pedido · ${$(sub+S.biz.fee)}</button></div></div></div>`+foot()}
function place(){if(!S.cart.length){S.err='Agrega al menos un producto.';return render()}const d=v('d').trim(),b=v('b').trim();if(!v('n')||!v('t')||!d||!b){S.err='Completa nombre, teléfono, dirección y barrio.';return render()}const id=Math.max(...S.orders.map(o=>o.id))+1,h=new Date().toTimeString().slice(0,5);S.orders.unshift({id,t:h,name:v('n'),phone:v('t'),addr:d+(v('a')?', '+v('a'):''),barrio:b,note:v('i'),items:S.cart.map(i=>({id:i.id,q:i.q,note:i.note})),fee:S.biz.fee,st:'Recibido',rid:S.rid,mine:S.user.email});S.cart=[];go('track',id)}
function track(){const o=S.orders.find(o=>o.id==S.oid),k=ST.indexOf(o.st);return nav()+`<div class="wrap"><h1>Ya estamos cocinando lo tuyo.</h1><p>Pedido #${o.id} · ${o.t} <button class="btn s o" onclick="render()">Actualizar estado</button></p><div class="card"><h3>${o.st}</h3><div class="steps">${ST.map((s,i)=>`<div class="${i<=k?'d':''}">${s}</div>`).join('')}</div><small>Llegada estimada: ${S.biz.time}</small></div><div class="two" style="margin-top:16px"><div class="card"><h3>Lo que te estamos preparando</h3>${o.items.map(i=>`<div class="row"><span>${i.q} × ${P(i.id).name}</span>${$(P(i.id).price*i.q)}</div>`).join('')}<div class="row"><b>Total con domicilio (${$(o.fee)})</b><b>${$(tot(o)+o.fee)}</b></div></div><div class="card"><h3>Tu entrega</h3>${o.addr}<br>${o.barrio}<br><small>${o.note}</small><br>Recibe: ${o.name} ${o.phone}</div></div></div>`+foot()}
function orders(){const l=S.orders.filter(o=>o.mine==S.user.email);return nav()+`<div class="wrap"><h1>Mis pedidos</h1>${l.map(o=>`<div class="card row" style="margin:8px 0;cursor:pointer" onclick="go('track',${o.id})"><span>#${o.id} · ${S.bizs[o.rid].name} · ${o.t}</span><span class="st ${o.st}">${o.st}</span><b>${$(tot(o)+o.fee)}</b></div>`).join('')||'<p>Aún no tienes pedidos.</p>'}</div>`+foot()}
function home(){return nav()+`<div class="wrap"><h1>¿Qué se te antoja hoy?</h1><p style="color:var(--mut)">Elige un restaurante y pide en pocos pasos. Tu pedido es de un restaurante a la vez.</p><div class="grid">${Object.entries(S.bizs).map(([id,b])=>`<div class="card" style="cursor:pointer" onclick="openR('${id}')"><div class="pimg">${b.emo}</div><div class="tag">${b.tag}</div><b>${b.name}</b><div style="color:var(--mut);font-size:13px">${b.open?'● Abierto':'Cerrado'} · ${b.time}<br>Domicilio ${$(b.fee)}</div></div>`).join('')}</div></div>`}
function openR(id){if(S.rid!=id)S.cart=[];S.rid=id;S.cat='Todos';S.q='';go('menu')}
function adminIn(){const r=Object.keys(S.bizs).find(k=>S.bizs[k].admin==v('e').trim());if(r&&v('p')){S.admin=true;S.rid=r;S.cart=[];S.tmp=[];window.sel=0;S.editId=RP()[0].id;go('a_orders')}else{S.err='Credenciales inválidas.';render()}}
// ADMIN
function a_login(){return authWrap('Todo listo para<br>un buen servicio.',`<span class="logo">FoodExpress · Administración</span><h2 style="margin-top:20px">Panel de restaurantes</h2><small style="color:var(--mut)">Prueba: camila@lamesa.co · andres@saborcriollo.co · sofia@nonna.co</small><label>Correo del administrador</label><input id="e" value="camila@lamesa.co"><label>Contraseña</label><input id="p" type="password" value="admin1234"><div class="err">${S.err}</div><button class="btn" onclick="adminIn()">Entrar a administración</button><p><a style="cursor:pointer;color:var(--mut)" onclick="go('login')">← Ir a FoodExpress</a></p>`)}
const shell=(t,h,body)=>`<div class="adm"><div class="side"><span class="logo">FoodExpress</span><small style="margin-bottom:10px">${S.biz.name}</small>${[['a_orders','Pedidos'],['a_prods','Productos'],['a_sales','Ventas'],['a_biz','Mi negocio']].map(x=>`<a class="${S.view==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</a>`).join('')}<span style="flex:1"></span><small>${S.biz.name}</small><a onclick="S.admin=false;go('a_login')">Cerrar sesión ↗</a></div><div class="wrap" style="width:100%"><h1>${t}</h1><p style="color:var(--mut)">${h}</p>${body}</div></div>`;
function a_orders(){const c=s=>RO().filter(o=>o.st==s).length;const l=RO().filter(o=>S.all||o.st!='Entregado');window.sel=RO().some(x=>x.id==window.sel)?window.sel:RO()[0].id;const o=RO().find(o=>o.id==sel)||RO()[0],nx=ST[ST.indexOf(o.st)+1];
return shell('La cocina está en marcha.','Organiza los pedidos de hoy y mantén a tus clientes al tanto.',`<div class="stats">${ST.map(s=>`<div class="card"><b>${c(s)+(S.rid=='r1'&&s=='Entregado'?18:0)}</b>${s}</div>`).join('')}</div><div class="two"><div class="card"><button class="chip ${S.all?'':'on'}" onclick="S.all=0;render()">Activos</button><button class="chip ${S.all?'on':''}" onclick="S.all=1;render()">Todos</button><div style="overflow-x:auto"><table><tr><th>Pedido / cliente<th>Dirección<th>Estado<th>Total</tr>${l.map(x=>`<tr style="cursor:pointer;${x.id==sel?'background:var(--soft)':''}" onclick="sel=${x.id};render()"><td><b>#${x.id}</b> · ${x.t}<br>${x.name}<td>${x.addr}<br><small>${x.barrio}</small><td><span class="st ${x.st}">${x.st}</span><td>${$(tot(x)+x.fee)}</tr>`).join('')}</table></div><div class="card" style="background:var(--soft);margin-top:12px"><b>#${o.id}</b> · ${o.items.map(i=>i.q+' '+P(i.id).name).join(', ')}<br><small>${o.items.filter(i=>i.note).map(i=>'Cocina: '+i.note).join(' ')} ${o.note?'Entrega: '+o.note:''}</small><br>${nx?`<button class="btn s" style="margin-top:8px" onclick="S.orders.find(x=>x.id==${o.id}).st='${nx}';render()">Mover a ${nx}</button>`:'<small>Pedido entregado ✓</small>'}</div></div>${manual()}</div>`)}
function manual(){const sub=S.tmp.reduce((s,i)=>s+P(i.id).price*i.q,0);return `<div class="card" style="align-self:start"><h3>Registrar un pedido</h3><small>Para solicitudes recibidas por teléfono.</small><label>Cliente</label><input id="mn"><label>Teléfono</label><input id="mt"><label>Dirección y barrio</label><input id="md"><label>Producto</label><select id="mp">${RP().filter(p=>p.on).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><button class="btn s o" style="margin-top:8px" onclick="mpAdd()">+ Agregar</button>${S.tmp.map(i=>`<div class="row"><span>${i.q} × ${P(i.id).name}</span>${$(P(i.id).price*i.q)}</div>`).join('')}<div class="row"><b>Total</b><b>${$(sub+(sub?S.biz.fee:0))}</b></div><div class="err">${S.err}</div><button class="btn" onclick="mpSave()">Guardar pedido</button></div>`}
function mpAdd(){keep();const id=v('mp'),i=S.tmp.find(x=>x.id==id);i?i.q++:S.tmp.push({id,q:1});render();restore()}
let mv={};function keep(){mv={mn:v('mn'),mt:v('mt'),md:v('md')}}function restore(){for(const k in mv)document.getElementById(k).value=mv[k]}
function mpSave(){if(!v('mn')||!v('md')||!S.tmp.length){S.err='Cliente, dirección y un producto son obligatorios.';keep();render();return restore()}const id=Math.max(...S.orders.map(o=>o.id))+1;S.orders.unshift({id,t:new Date().toTimeString().slice(0,5),name:v('mn'),phone:v('mt'),addr:v('md'),barrio:'',note:'',items:S.tmp,fee:S.biz.fee,st:'Recibido',rid:S.rid});S.tmp=[];sel=id;mv={};go('a_orders')}
function a_prods(){const p=P(S.editId)||{id:'',name:'',cat:'Platos fuertes',price:'',desc:'',on:true};return shell('Un menú bien cuidado.','Consulta el catálogo, registra productos y actualiza lo que ofreces.',`<div class="two"><div class="card"><table><tr><th>Producto<th>Precio<th>Estado</tr>${RP().map(x=>`<tr style="cursor:pointer;${x.id==S.editId?'background:var(--soft)':''}" onclick="S.editId='${x.id}';render()"><td><b>${x.name}</b><br><small>${x.id} · ${x.cat}</small><td>${$(x.price)}<td>${x.on?'Disponible':'Agotado'}</tr>`).join('')}</table><p class="ok">¿Se agotó un plato? Desactiva su disponibilidad y no se podrá pedir.</p></div><div class="card" style="align-self:start"><h3>${p.id?'Editar producto':'Nuevo producto'}</h3><button class="btn s o" style="float:right;margin-top:-28px" onclick="S.editId='';render()">Nuevo producto</button><label>Nombre</label><input id="pn" value="${p.name}"><label>Categoría</label><input id="pc" value="${p.cat}"><label>Precio (COP)</label><input id="pp" type="number" value="${p.price}"><label>Descripción</label><textarea id="pd">${p.desc}</textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="tg" id="po" ${p.on?'checked':''} style="width:auto"> Disponible en el menú</label><div class="err">${S.err}</div><button class="btn" onclick="saveP()">Guardar cambios</button></div></div>`)}
function saveP(){const pr=+v('pp');if(!v('pn')||!(pr>0)){S.err='Nombre y precio válido son obligatorios.';return render()}let p=P(S.editId);if(!p){p={id:'X'+(S.prods.length+1),emo:'🍽️',rid:S.rid};S.prods.push(p);S.editId=p.id}Object.assign(p,{name:v('pn'),cat:v('pc')||'Platos fuertes',price:pr,desc:v('pd'),on:document.getElementById('po').checked});S.msg='';render()}
function a_sales(){const k1=S.rid=='r1',base={P005:[112,896000],P001:[96,2688000],P004:[70,840000],P003:[52,1508000],P006:[40,400000],P002:[34,1088000]},u={};if(k1)for(const k in base)u[k]=[...base[k]];let ord=k1?154:0,add=0;RO().filter(o=>o.st=='Entregado'&&(o.id>1043||!k1)).forEach(o=>{ord++;o.items.forEach(i=>{u[i.id]=u[i.id]||[0,0];u[i.id][0]+=i.q;u[i.id][1]+=P(i.id).price*i.q;add+=P(i.id).price*i.q})});const tp=(k1?7420000:0)+add,days=(k1?[['Jue',820],['Vie',1120],['Sáb',1940],['Dom',2220],['Lun',0],['Mar',780],['Mié',540+add/1000]]:[['Hoy',add/1000]]),mx=2500,top=Object.entries(u).sort((a,b)=>b[1][0]-a[1][0]);
return shell('Los números también cuentan.','Una mirada a tus ventas y a los favoritos de tus clientes.',`<div class="stats"><div class="card"><b>${$(tp)}</b>Ventas de productos</div><div class="card"><b>${ord}</b>Pedidos entregados</div><div class="card"><b>${$(ord?Math.round(tp/ord):0)}</b>Promedio por pedido</div><div class="card"><b>${$((k1?540000:0)+add)}</b>Ventas de hoy</div></div><div class="two"><div class="card"><h3>Ventas por día</h3><small>1 al 7 de octubre · miles de COP</small><div class="bars" style="margin:12px 0 26px">${days.map(d=>`<div class="${d[0]=='Dom'?'m':''}" style="height:${Math.max(2,d[1]/mx*100)}%">${Math.round(d[1])||''}<span>${d[0]}</span></div>`).join('')}</div><small>${k1?'El domingo fue el día de mayor venta: $2.220.000. Los lunes el restaurante permanece cerrado.':'Aún no hay histórico. Las ventas aparecerán al entregar pedidos.'}</small></div><div class="card"><h3>Productos con mayor demanda</h3><table>${top.map(([id,x])=>`<tr><td>${P(id).name}<td>${x[0]} u.<td>${$(x[1])}</tr>`).join('')}</table><small>Solo incluye pedidos entregados.</small></div></div>`)}
function a_biz(){const b=S.biz,dias=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];return shell('La esencia de La Mesa.','Mantén al día la información que tus clientes necesitan conocer.',`<div class="two"><div class="card"><h3>Información del restaurante</h3><label>Nombre</label><input id="bn" value="${b.name}"><label>Descripción</label><textarea id="bd">${b.desc}</textarea><label>Dirección</label><input id="ba" value="${b.addr}"><label>Teléfono</label><input id="bt" value="${b.tel}"><label>Correo</label><input id="bm" value="${b.mail}"><h3 style="margin-top:20px">Información de entrega</h3><label>Costo del domicilio (COP)</label><input id="bf" type="number" value="${b.fee}"><label>Tiempo estimado</label><input id="bi" value="${b.time}"><label>Barrios de cobertura</label><input id="bz" value="${b.zones}"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bo" style="width:auto" ${b.open?'checked':''}> Abierto · recibe pedidos</label>${S.msg?`<div class="ok">${S.msg}</div>`:''}<button class="btn" onclick="saveB()">Guardar cambios</button></div><div class="card" style="align-self:start"><h3>Horarios de atención</h3>${dias.map((d,i)=>`<div class="row"><span>${d}</span><span>${i?'12:00 – 21:00':'Cerrado'}</span></div>`).join('')}</div></div>`)}
function saveB(){const f=+v('bf');if(!v('bn')||f<0)return;Object.assign(S.biz,{name:v('bn'),desc:v('bd'),addr:v('ba'),tel:v('bt'),mail:v('bm'),fee:f,time:v('bi'),zones:v('bz'),open:document.getElementById('bo').checked});S.msg='Cambios guardados ✓';render()}
render();
</script></body></html>
